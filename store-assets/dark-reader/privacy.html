<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜幕护眼 隐私政策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;max-width:880px;margin:40px auto;padding:0 24px;color:#243047;line-height:1.75}h1{color:#334155}h2{margin-top:26px}section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px}.muted{color:#64748b}</style></head><body><h1>夜幕护眼 - 网页暗色滤镜 隐私政策</h1><p class="muted">生效日期：2026-07-21　版本：1.0.1</p><section>本扩展不出售、上传或共享用户数据，不投放广告，不连接开发者服务器。</section><h2>用途</h2><p>在网页中应用本地 CSS 滤镜，并提供亮度、对比度、色温及网站白名单设置。</p><h2>数据与权限</h2><p><code>storage</code> 仅在本机保存开关、视觉参数和白名单域名。内容脚本只修改页面视觉样式，不读取或保存页面正文。网站访问范围用于运行暗黑样式及识别白名单域名。</p><h2>远程代码</h2><p>所有 JavaScript 均包含在扩展安装包内，不加载远程代码。</p><h2>删除</h2><p>在扩展设置中清除数据或卸载扩展即可删除本地设置。</p></body></html>
