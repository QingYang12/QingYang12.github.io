<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>萌宠桌面伴侣 隐私政策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;max-width:880px;margin:40px auto;padding:0 24px;color:#243047;line-height:1.75}h1{color:#6d28d9}h2{margin-top:26px}section{background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:18px}.muted{color:#64748b}</style></head><body><h1>萌宠桌面伴侣 隐私政策</h1><p class="muted">生效日期：2026-07-21　版本：1.2.1</p><section>本扩展不上传、出售或共享用户数据，不投放广告，不连接开发者服务器。</section><h2>用途</h2><p>在网页上显示本地像素宠物，并提供点击互动、对话气泡和自定义宠物图片。</p><h2>数据与权限</h2><p><code>storage</code> 只在本机保存宠物选择、动画设置和用户主动上传的宠物图片。内容脚本仅渲染宠物界面，不读取网页正文。</p><h2>网络与删除</h2><p>扩展不发起网络请求、不加载远程代码。清除扩展数据或卸载扩展即可删除本地内容。</p></body></html>
